compliance:
  local_sessions_api: true
  endpoints:
    - "/v1/compliance/apps/sessions/local"
    - "/v1/compliance/apps/sessions/local/{id}"
    - "/v1/compliance/apps/sessions/local/{id}/messages"
  required_scope: "read:compliance_user_data"

managed_agents:
  hard_spend_budget: true
  budget_field: "budget_usd_cents"
  pause_stop_reason: "budget_reached"
  advisor_roster: true
  agent_inference_geo: true

response_metadata:
  workspace_id_header: "anthropic-workspace-id"
  request_id_header: "request-id"
  rate_limit_requests_remaining_header: "anthropic-ratelimit-requests-remaining"
  rate_limit_tokens_remaining_header: "anthropic-ratelimit-tokens-remaining"
