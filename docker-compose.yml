services:
  zpostgressql:
    container_name: zpostgressql
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: zcoder
      # POSTGRES_PASSWORD ถูกเซตผ่าน secrets ไม่ใช่ hardcode ใน environment
      POSTGRES_PASSWORD_FILE: /run/secrets/zcoder_postgres_password
      POSTGRES_DB: zcoder_db
    volumes:
      - zpostgressql_data:/var/lib/postgresql/data
    networks:
      - zpostgressql_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zcoder -d zcoder_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    secrets:
      - zcoder_postgres_password

  zredis:
    container_name: zredis
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru"]
    environment:
      # REDIS_PASSWORD ถูกเซตผ่าน secrets ไม่ใช่ hardcode ใน environment
      REDIS_PASSWORD_FILE: /run/secrets/zredis_password
    volumes:
      - zredis_data:/data
    networks:
      - zpostgressql_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    secrets:
      - zredis_password

  ollama:
    container_name: zcoder-llm
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
      - type: bind
        source: ${ZCODER_MODELS_DIR:-/zdata/models}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:11434/api/version"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - default
      - zpostgressql_network
    init: true
    restart: unless-stopped
    # Deliberately no published ports. ZCoder shares this network namespace
    # and reaches the loopback-only inference endpoint at 127.0.0.1:11434.

  zcoder:
    container_name: zcoder
    build:
      context: .
      dockerfile: Dockerfile
    image: zcoder:latest
    environment:
      ZCODER_BASE_URL: http://127.0.0.1:11434/v1
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      ZCODER_PROVIDER: ollama
      ZCODER_MODEL: ${ZCODER_MODEL:-zcoder-pro}
      ZCODER_ROUTE_PROVIDER: ${ZCODER_ROUTE_PROVIDER:-}
      ZCODER_NVIDIA_MODELS: ${ZCODER_NVIDIA_MODELS:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-${NVIDIA_API_KEY_1:-${NVIDIA_API_KEY_2:-}}}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      ZCODER_POSTGRES_HOST: zpostgressql
      ZCODER_POSTGRES_PORT: "5432"
      ZCODER_POSTGRES_PASSWORD_FILE: /run/secrets/zcoder_postgres_password
      ZCODER_REDIS_HOST: zredis
      ZCODER_REDIS_PORT: "6379"
      ZCODER_REDIS_PASSWORD_FILE: /run/secrets/zredis_password
      ZCODER_LOG_FORMAT: json
      ZCODER_LOG_LEVEL: INFO
    secrets:
      - zcoder_postgres_password
      - zredis_password
    volumes:
      # Persist config/cache across container restarts without baking
      # secrets or state into the image.
      - zcoder-home:/home/zcoder
    network_mode: "service:ollama"
    depends_on:
      ollama:
        condition: service_healthy
      zpostgressql:
        condition: service_healthy
      zredis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "zcoder.main", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stdin_open: true
    tty: true
    command: ["--interactive"]

volumes:
  zcoder-home:
  zpostgressql_data:
  zredis_data:
  ollama_data:

networks:
  zpostgressql_network:

secrets:
  zcoder_postgres_password:
    file: ${ZCODER_POSTGRES_SECRET_SOURCE:-${HOME}/.config/zcoder/postgresql.password}
  zredis_password:
    file: /home/cvsz/.config/zcoder/redis.password
