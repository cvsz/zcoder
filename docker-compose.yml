services:
  llama-server:
    container_name: zcoder-llm
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    command:
      - --model
      - /models/${ZCODER_GGUF_FILE:-qwen-7b-q4km.gguf}
      - --alias
      - ${ZCODER_MODEL:-qwen-7b-q4km}
      - --host
      - 127.0.0.1
      - --port
      - "8080"
      - --ctx-size
      - "${ZCODER_CTX_SIZE:-4096}"
    volumes:
      - type: bind
        source: ${ZCODER_MODELS_DIR:-./models}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    networks:
      - default
      - zPostgreSQL_network
    init: true
    restart: unless-stopped
    # Deliberately no published ports. ZCoder shares this network namespace
    # and reaches the loopback-only inference endpoint at 127.0.0.1:8080.

  zcoder:
    container_name: zcoder
    build:
      context: .
      dockerfile: Dockerfile
    image: zcoder:latest
    environment:
      ZCODER_BASE_URL: http://127.0.0.1:8080/v1
      ZCODER_MODEL: ${ZCODER_MODEL:-qwen-7b-q4km}
      ZCODER_ROUTE_PROVIDER: ${ZCODER_ROUTE_PROVIDER:-}
      ZCODER_NVIDIA_MODELS: ${ZCODER_NVIDIA_MODELS:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-${NVIDIA_API_KEY_1:-${NVIDIA_API_KEY_2:-}}}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      ZCODER_POSTGRES_HOST: zPostgreSQL
      ZCODER_POSTGRES_PORT: "5432"
      ZCODER_POSTGRES_PASSWORD_FILE: /run/secrets/zcoder_postgres_password
      ZCODER_LOG_FORMAT: json
      ZCODER_LOG_LEVEL: INFO
    secrets:
      - zcoder_postgres_password
    volumes:
      # Persist config/cache across container restarts without baking
      # secrets or state into the image.
      - zcoder-home:/home/zcoder
    network_mode: "service:llama-server"
    depends_on:
      llama-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "zcoder.main", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stdin_open: true
    tty: true
    command: ["--interactive"]

volumes:
  zcoder-home:

networks:
  zPostgreSQL_network:
    external: true

secrets:
  zcoder_postgres_password:
    file: ${ZCODER_POSTGRES_SECRET_SOURCE:-${HOME}/.config/zcoder/postgresql.password}
