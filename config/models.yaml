# Multi-sector model configuration for ZCoder local inference via Ollama.
#
# Models อ่านจาก /zdata/models/ และ serve ผ่าน Ollama (http://127.0.0.1:11434)
# ตั้งแต่ ZCoder v1.60.0: ใช้ Ollama เป็น inference runtime ทั้งหมด
# llama-server binary ถูกยกเลิกแล้ว
#
# All inference is local-only (loopback); no hosted model API calls are made.

# Ollama binary path (shared singleton process — ไม่ใช่ per-sector)
model_server_binary: /usr/local/bin/ollama

# Directory containing GGUF model files.
models_dir: /zdata/models

# Runtime state directory (pidfiles) and log directory.
run_dir: /home/cvsz/zcoder/run
log_dir: /home/cvsz/zcoder/logs

# Defaults applied to sectors that omit a field.
default_ctx_size: 32768
default_threads: -1
default_gpu_layers: -1

# Seconds to wait for health check after starting a sector.
start_timeout: 120
# Seconds to wait for a sector to terminate on stop.
stop_timeout: 15

sectors:
  - name: zcoder-flash
    model: zcoder-flash.gguf
    alias: zcoder-flash
    host: 127.0.0.1
    port: 11434
    ctx_size: 32768
    enabled: true

  - name: zcoder-pro
    model: zcoder-pro.gguf
    alias: zcoder-pro
    host: 127.0.0.1
    port: 11434
    ctx_size: 131072
    enabled: true

  - name: zcoder-promax
    model: zcoder-promax.gguf
    alias: zcoder-promax
    host: 127.0.0.1
    port: 11434
    ctx_size: 262144
    enabled: true

  - name: zcoder-max
    model: zcoder-max.gguf
    alias: zcoder-max
    host: 127.0.0.1
    port: 11434
    ctx_size: 262144
    enabled: true
