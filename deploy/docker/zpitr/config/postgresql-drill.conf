# postgresql-drill.conf — Recovery configuration template for zPITR isolated drill instance
# These settings are injected into postgresql.auto.conf during run_restore_drill.sh

restore_command = 'cp /var/backups/wal_archive/%f %p'
recovery_target_action = 'promote'
port = 55433
max_connections = 5
shared_buffers = 128MB
work_mem = 4MB
log_min_messages = info
log_destination = 'stderr'
logging_collector = off
