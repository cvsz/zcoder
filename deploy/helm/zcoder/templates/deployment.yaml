apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zcoder.fullname" . }}-api
  labels:
    app.kubernetes.io/name: {{ include "zcoder.name" . }}-api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "zcoder.name" . }}-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "zcoder.name" . }}-api
    spec:
      serviceAccountName: {{ include "zcoder.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: ZCODER_PROFILE
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zcoder.fullname" . }}-worker-standard
  labels:
    app.kubernetes.io/name: {{ include "zcoder.name" . }}-worker
spec:
  replicas: {{ .Values.workers.standard.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "zcoder.name" . }}-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "zcoder.name" . }}-worker
    spec:
      terminationGracePeriodSeconds: {{ .Values.workers.standard.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "zcoder.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          args: ["python", "worker_process.py", "--pool-type", "standard"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: ZCODER_PROFILE
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey }}
          resources:
            {{- toYaml .Values.workers.standard.resources | nindent 12 }}
