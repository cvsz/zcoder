# Gitleaks configuration.
#
# Keep the default rule set and allow only verified false positives.
# Note: `paths` values are compiled as regular expressions by gitleaks
# (glob syntax such as `tests/**/*.py` is NOT valid here and aborts the scan).

[extend]
useDefault = true

[allowlist]
description = "Test files containing intentionally fake tokens"
paths = [
    'tests/.*\.py$',
    'tests/.*\.md$',
    'tests/.*\.txt$',
]
regexes = [
    "dummy",
    "test-token",
    "fake-token",
    "test-token-123",
    "hunter2",
    "s3cr3t",
    "abcdef123456xyz",
    'Authorization: Bearer',
    "curl -H 'Authorization:",
]
