groups:
  - name: zcoder_alerts
    rules:
      - alert: ZcoderApiDown
        expr: up{job="zcoder"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ZCoder API server is down"
          description: "ZCoder API (job=zcoder, target={{ $labels.instance }}) has been unreachable for more than 1 minute."

      - alert: ZcoderApiSlow
        expr: histogram_quantile(0.95, rate(zcoder_http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ZCoder API p95 latency is high"
          description: "ZCoder API p95 request latency exceeds 2s over the last 5 minutes."
