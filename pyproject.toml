[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zcoder"
version = "1.40.0"
description = "ZCoder CLI — enterprise-grade edition"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.75.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "textual>=0.80.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "starlette>=0.27.0",
]
tui = ["textual>=0.80.0"]
excel = ["pandas>=2.0.0", "openpyxl>=3.1.0"]
pptx = ["python-pptx>=0.6.23"]
all = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "starlette>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "psycopg2-binary>=2.9.9",
    "ruff>=0.6.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "bandit>=1.7.9",
]

[project.scripts]
zcoder = "zcoder.main:main"
zcoder-server = "zcoder.api.server:start"
zcoder-api = "zcoder.api.server:start"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["zcoder*"]

[tool.setuptools.package-data]
zcoder = ["api/*.yaml"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/zcoder"]
omit = [
    "tests/*",
    "build/*",
    "dist/*",
    "*/__pycache__/*",
    # The src-layout migration keeps these legacy/optional compatibility
    # surfaces packaged, but the release coverage gate measures the modern
    # durable core. Their dedicated suites still run; they are only excluded
    # from the aggregate percentage denominator.
    "src/zcoder/claude/*",
    "src/zcoder/main.py",
    "src/zcoder/services/projects.py",
    "src/zcoder/services/cowork.py",
    "src/zcoder/infrastructure/artifacts.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/zcoder/claude/capabilities/code.py" = ["E402", "E741"]
"src/zcoder/claude/capabilities/embeddings.py" = ["E741"]
"src/zcoder/claude/enterprise/hooks_perms.py" = ["E402", "E741"]
"src/zcoder/claude/integrations/github.py" = ["E741"]
"src/zcoder/claude/orchestration/sessions.py" = ["E741"]
"src/zcoder/claude/rag/research.py" = ["E741"]
"src/zcoder/claude/integrations/powerpoint.py" = ["F401"]
"src/zcoder/infrastructure/observability/otel.py" = ["F401"]
"src/zcoder/infrastructure/stores/postgres.py" = ["F401"]
"src/zcoder/interfaces/cli/tui.py" = ["F401"]
"tests/integration/test_auth_oidc.py" = ["B017"]
"tests/unit/test_claude_models_deprecation.py" = ["E402"]

[tool.black]
line-length = 110
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
