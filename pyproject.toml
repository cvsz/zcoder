[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zcoder"
version = "1.40.0"
description = "AI Model Coder CLI — enterprise-grade edition"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "starlette>=0.27.0",
]
tui = [
    "textual>=0.40.0",
]
all = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "starlette>=0.27.0",
    "textual>=0.40.0",
]
dev = [
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
zcoder = "main:main"
ai-coder = "main:main"

[tool.setuptools]
py-modules = [
    "agent_runtime",
    "anthropic_conformance",
    "artifacts",
    "auth_oidc",
    "backup_restore",
