    "claude_compliance_api",
    "claude_cost_optimizer",
    "claude_embeddings",
    "claude_eval",
    "claude_evals",
    "claude_excel",
    "claude_fable5",
    "claude_files",
    "claude_git",
    "claude_github",
    "claude_haiku45",
    "claude_hooks_perms_plan",
    "claude_interactive",
    "claude_live",
    "claude_mcp_connector",
    "claude_memory",
    "claude_metrics",
    "claude_model_preflight",
    "claude_models",
    "claude_mythos5",
    "claude_observability",
    "claude_opus5",
    "claude_output_styles",
    "claude_plugins",
    "claude_powerpoint",
    "claude_prompt_optimizer",
    "claude_rag",
