"$schema": "https://github.com/github/codeql-action/raw/main/codeql-config-schema.json"

disable-default-queries: false

queries:
  - uses: security-and-quality

# No alert suppressions are defined here on purpose: every code-scanning
# finding from this query set is remediated in code and verified by a local
# CodeQL run (docs/audit/CODEQL-REMEDIATION.md). Adding suppressions requires
# documented justification and an independent reviewer sign-off.
