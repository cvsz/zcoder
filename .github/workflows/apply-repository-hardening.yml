name: Apply repository hardening

on:
  push:
    branches: [chore/complete-repository-hardening]
    paths:
      - "scripts/apply_repository_hardening.py"
      - "scripts/run_repository_hardening.py"
      - ".github/workflows/apply-repository-hardening.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/complete-repository-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/run_repository_hardening.py
      - run: ruff check --fix src tests scripts --exclude apply_repository_hardening.py --exclude run_repository_hardening.py
      - run: black src tests scripts/check_docs.py
      - run: python scripts/check_docs.py
      - name: Commit deterministic migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: harden repository docs security and automation"
          git push origin HEAD:chore/complete-repository-hardening
