name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v1.40.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  qualify-release:
    name: Qualify Exact Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
    steps:
      - name: Validate release tag
        run: |
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid release tag"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install release gate
        run: python -m pip install -e .
      - name: Await hosted checks on the release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/import_release_evidence.py --await --timeout-minutes 30
      - name: Enforce production qualification
        run: python scripts/release_gate.py --check

  build-python-dist:
    name: Build Python Wheel & Sdist
    needs: [qualify-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate release tag
        run: |
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::RELEASE_TAG '${RELEASE_TAG}' does not match required semver pattern ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?\$"
            exit 1
          fi

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build tools
        run: pip install --upgrade build==1.5.0 wheel==0.48.0

      - name: Build packages
        run: python -m build

      - name: Upload Python packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  build-linux-binary:
    name: Build Linux Standalone Binary
    needs: [qualify-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Build Linux executable
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
          mv dist/zcoder dist/zcoder-linux-x86_64

      - name: Upload Linux binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-linux
          path: dist/zcoder-linux-x86_64
          if-no-files-found: error
          retention-days: 14

  build-windows-binary:
    name: Build Windows Standalone Executable
    needs: [qualify-release]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Build Windows executable
        shell: cmd
        run: |
          call scripts\build.bat
          if errorlevel 1 exit /b 1
          move dist\zcoder.exe dist\zcoder-windows-x86_64.exe

      - name: Upload Windows binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-windows
          path: dist/zcoder-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-python-dist, build-linux-binary, build-windows-binary]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SBOM for release assets
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/sbom.spdx.json
          artifact-name: release-sbom-spdx
          upload-release-assets: false

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
