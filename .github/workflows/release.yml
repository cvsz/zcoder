name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.40.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-python-dist:
    name: Build Python Wheel & Sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --upgrade build wheel

      - name: Build packages
        run: python -m build

      - name: Upload Python packages
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  build-linux-binary:
    name: Build Linux Standalone Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Linux executable
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
          mv dist/ai-coder dist/ai-coder-linux-x86_64

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux
          path: dist/ai-coder-linux-x86_64

  build-windows-binary:
    name: Build Windows Standalone Executable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows executable
        shell: cmd
        run: |
          scripts\build.bat
          move dist\ai-coder.exe dist\ai-coder-windows-x86_64.exe

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-windows
          path: dist/ai-coder-windows-x86_64.exe

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-python-dist, build-linux-binary, build-windows-binary]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
