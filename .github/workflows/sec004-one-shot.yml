name: SEC-004 bounded one-shot patch

on:
  push:
    branches:
      - security-04-codeagent-filesystem-boundary-v9
    paths:
      - .github/workflows/sec004-one-shot.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: security-04-codeagent-filesystem-boundary-v9

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact SEC-004 containment patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/zcoder/claude/capabilities/code.py")
          text = path.read_text(encoding="utf-8")

          import_old = '''from zcoder.core.resilience import (
              CircuitBreaker,
              raise_for_http_error,
              retry,
              safe_urlopen,
              shell_command_argv,
              urlopen_json,
          )

          MESSAGES_ENDPOINT'''
          import_new = '''from zcoder.core.resilience import (
              CircuitBreaker,
              raise_for_http_error,
              retry,
              safe_urlopen,
              shell_command_argv,
              urlopen_json,
          )
          from zcoder.core.security import safe_resolve

          MESSAGES_ENDPOINT'''
          if import_old not in text:
              raise SystemExit("SEC-004 import anchor did not match exact baseline")
          text = text.replace(import_old, import_new, 1)

          exact_replacements = {
              'p = Path(cwd) / inputs["path"]': 'p = safe_resolve(inputs["path"], cwd)',
              'base = Path(cwd) / inputs.get("path", ".")': 'base = safe_resolve(inputs.get("path", "."), cwd)',
              'p = Path(cwd) / inputs.get("path", ".")': 'p = safe_resolve(inputs.get("path", "."), cwd)',
          }
          expected_counts = {
              'p = Path(cwd) / inputs["path"]': 3,
              'base = Path(cwd) / inputs.get("path", ".")': 2,
              'p = Path(cwd) / inputs.get("path", ".")': 1,
          }
          for old, new in exact_replacements.items():
              actual = text.count(old)
              if actual != expected_counts[old]:
                  raise SystemExit(f"SEC-004 anchor count mismatch for {old!r}: expected {expected_counts[old]}, got {actual}")
              text = text.replace(old, new)

          # Glob/rglob patterns are path-like inputs too.  A safe base directory
          # alone is insufficient if a pattern itself contains a parent segment.
          glob_old = '''            elif name == "Glob":
              pattern = inputs["pattern"]
              base = safe_resolve(inputs.get("path", "."), cwd)
              matches = sorted(base.glob(pattern))'''
          glob_new = '''            elif name == "Glob":
              pattern = inputs["pattern"]
              if Path(pattern).is_absolute() or ".." in Path(pattern).parts:
                  raise ValueError("Glob pattern must stay inside the workspace")
              base = safe_resolve(inputs.get("path", "."), cwd)
              matches = sorted(base.glob(pattern))'''
          if glob_old not in text:
              raise SystemExit("SEC-004 Glob anchor did not match")
          text = text.replace(glob_old, glob_new, 1)

          grep_old = '''              pattern = inputs["pattern"]
              base = safe_resolve(inputs.get("path", "."), cwd)
              include = inputs.get("include", "*")
              results = []'''
          grep_new = '''              pattern = inputs["pattern"]
              base = safe_resolve(inputs.get("path", "."), cwd)
              include = inputs.get("include", "*")
              if Path(include).is_absolute() or ".." in Path(include).parts:
                  raise ValueError("Grep include pattern must stay inside the workspace")
              results = []'''
          if grep_old not in text:
              raise SystemExit("SEC-004 Grep anchor did not match")
          text = text.replace(grep_old, grep_new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Install focused validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Focused formatting and lint
        run: |
          black --check src/zcoder/claude/capabilities/code.py tests/unit/test_codeagent_filesystem_boundary.py
          ruff check src/zcoder/claude/capabilities/code.py tests/unit/test_codeagent_filesystem_boundary.py

      - name: Focused SEC-004 regression suite
        run: |
          pytest -q tests/unit/test_codeagent_filesystem_boundary.py tests/unit/test_security.py

      - name: Remove one-shot workflow and commit validated patch
        shell: bash
        run: |
          rm .github/workflows/sec004-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exec-planning.md src/zcoder/claude/capabilities/code.py tests/unit/test_codeagent_filesystem_boundary.py .github/workflows/sec004-one-shot.yml
          git diff --cached --check
          git commit -m 'security: contain CodeAgent filesystem tools to workspace'
          git push origin HEAD:security-04-codeagent-filesystem-boundary-v9
