name: SDK & TypeScript Check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sdk-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ts-check:
    name: Validate TypeScript SDK & Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install TypeScript compiler
        run: npm install --global typescript@7.0.2

      - name: Show toolchain versions
        run: |
          node --version
          npm --version
          tsc --version

      - name: Type check TypeScript SDK
        run: tsc --noEmit --target ES2022 --module NodeNext zcoder-sdk.ts
