name: SDK & TypeScript Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ts-check:
    name: Validate TypeScript SDK & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install TypeScript compiler
        run: npm install -g typescript

      - name: Type check TypeScript SDK
        run: tsc --noEmit --target ES2022 --module NodeNext zcoder-sdk.ts
