name: Temporary Black Diff

on:
  push:
    branches:
      - security-04-codeagent-filesystem-boundary-v9
    paths:
      - .github/workflows/black-diff-temp.yml

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install black==26.5.1
      - name: Show exact Black diff
        run: black --diff tests/unit/test_codeagent_filesystem_boundary.py || true
