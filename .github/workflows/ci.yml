name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff check .gemini/skills/gemini-omni-flash-api/scripts/upload_file.py .gemini/skills/gemini-omni-flash-api/scripts/video/generate_video.py .gemini/skills/gemini-omni-flash-api/scripts/video/inspect_video.py .gemini/skills/gemini-omni-flash-api/scripts/video/prep_video.py
      - name: Check Black formatting for changed Python files
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            changed_files="$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- '*.py')"
          else
            changed_files="$(git diff --name-only --diff-filter=ACMR "$EVENT_BEFORE...HEAD" -- '*.py')"
          fi
          if [[ -n "$changed_files" ]]; then
            printf '%s\n' "$changed_files" | xargs -r black --check
          else
            echo "No changed Python files to format-check."
          fi
      - run: mypy src/zcoder webapp --ignore-missing-imports

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: bandit -r src -ll

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      zpostgresql:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: zcoder
          POSTGRES_PASSWORD: zcoder
          POSTGRES_DB: zcoder_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://zcoder:zcoder@zpostgresql:5432/zcoder_db
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -c "import zipfile; from pathlib import Path; wheel=next(Path('dist').glob('zcoder-*.whl')); names=set(zipfile.ZipFile(wheel).namelist()); assert any(n.startswith('zgpu/') for n in names), 'zgpu package missing'; assert not any(n.startswith('zgpu/tests/') for n in names), 'zGPU tests must not be packaged'; required={'zgpu/dashboard/index.html','zgpu/dashboard/dashboard.css','zgpu/dashboard/dashboard.js'}; assert required.issubset(names), f'zGPU dashboard assets missing from wheel {sorted(required - names)}'"
      - run: python -c "import zcoder; import zgpu; import main; print(zcoder.__version__)"
      - run: pytest --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker build -t zcoder:ci .
      - run: docker run --rm zcoder:ci --version
