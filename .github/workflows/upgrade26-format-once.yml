name: Upgrade-26 Format Once

on:
  push:
    branches:
      - upgrade-26-run-lease

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade-26-run-lease
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install black==26.5.1
      - name: Format Upgrade-26 lease
        run: black src/zcoder/services/upgrade_lease.py
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/upgrade26-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/zcoder/services/upgrade_lease.py .github/workflows/upgrade26-format-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format Upgrade-26 lease"
          git push
