name: Upgrade-24 format once

on:
  push:
    branches: [feat/upgrade-24-continuous-loop]
    paths:
      - '.github/workflows/upgrade24-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/upgrade-24-continuous-loop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install black==26.5.1
      - run: black src/zcoder/services/upgrade_loop.py
      - name: Commit formatter result and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/upgrade24-format-once.yml
          git add src/zcoder/services/upgrade_loop.py
          git commit -m 'style(upgrade-24): apply Black formatting'
          git push origin HEAD:feat/upgrade-24-continuous-loop
