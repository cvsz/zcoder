name: Black Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install black==26.5.1
      - name: Show exact Black diff
        run: black --diff src/zcoder/core/security.py
