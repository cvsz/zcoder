name: Upgrade-35 Format Fix Once

on:
  push:
    branches:
      - upgrade-35-maintenance-observability

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade-35-maintenance-observability
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonical Black formatting
        run: |
          python -m pip install --disable-pip-version-check black==26.5.1
          black tests/unit/test_maintenance_campaign_events.py
          rm .github/workflows/upgrade35-format-fix-once.yml
      - name: Commit canonical fixture format
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/unit/test_maintenance_campaign_events.py .github/workflows/upgrade35-format-fix-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: format Upgrade-35 empty campaign fixture'
          git push origin HEAD:upgrade-35-maintenance-observability
