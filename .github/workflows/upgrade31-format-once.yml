name: Upgrade-31 Format Once

on:
  push:
    branches:
      - upgrade-31-postgres-fencing

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade-31-postgres-fencing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format Upgrade-31 files
        run: |
          python -m pip install --disable-pip-version-check black==26.5.1
          black --line-length 110 \
            src/zcoder/services/upgrade_postgres_fence.py \
            tests/integration/test_upgrade_postgres_fence_live.py
          rm .github/workflows/upgrade31-format-once.yml
      - name: Commit canonical formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/zcoder/services/upgrade_postgres_fence.py tests/integration/test_upgrade_postgres_fence_live.py .github/workflows/upgrade31-format-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: format Upgrade-31 PostgreSQL fencing'
          git push origin HEAD:upgrade-31-postgres-fencing
