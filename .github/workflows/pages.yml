name: Deploy Web Console to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "webapp/frontend/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "webapp/frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Validate static console
        run: |
          test -f webapp/frontend/index.html
          test -f webapp/frontend/app.js
          test -f webapp/frontend/style.css
          grep -q "ZCoder — AI Engineering Console" webapp/frontend/index.html
          node --check webapp/frontend/app.js
          touch webapp/frontend/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: webapp/frontend

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
