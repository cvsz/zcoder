name: One-shot lint autofix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lint-autofix-once.yml'

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, '[lint-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Apply safe Ruff fixes
        run: ruff check . --fix || true
      - name: Apply Black formatting
        run: black .
      - name: Show remaining Ruff violations
        run: ruff check . || true
      - name: Commit autofix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No autofix changes produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply safe Ruff and Black fixes [lint-autofix]'
          git push origin HEAD:main
