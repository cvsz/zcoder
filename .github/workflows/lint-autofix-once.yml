name: One-shot Ruff unsafe autofix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lint-autofix-once.yml'

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Apply Ruff unsafe fixes
        run: ruff check . --fix --unsafe-fixes || true
      - name: Apply Black formatting
        run: black .
      - name: Collect residual Ruff diagnostics
        shell: bash
        run: |
          ruff check . --output-format=json > ruff-after.json || true
          ruff check . > ruff-after.txt 2>&1 || true
      - name: Upload residual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-after-unsafe
          path: |
            ruff-after.json
            ruff-after.txt
      - name: Commit autofix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No unsafe autofix changes produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply remaining Ruff autofixes [lint-autofix]'
          git push origin HEAD:main
