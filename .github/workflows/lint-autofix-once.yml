name: One-shot CI diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lint-autofix-once.yml'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Collect Ruff diagnostics
        shell: bash
        run: |
          ruff check . --output-format=json > ruff.json || true
          ruff check . > ruff.txt 2>&1 || true
      - name: Collect Black diagnostics
        shell: bash
        run: black --check . > black.txt 2>&1 || true
      - name: Collect Bandit diagnostics
        shell: bash
        run: |
          bandit -r . -ll -f json -o bandit.json || true
          bandit -r . -ll > bandit.txt 2>&1 || true
      - name: Collect pytest diagnostics
        shell: bash
        run: pytest --cov --cov-report=term-missing > pytest.txt 2>&1 || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            ruff.json
            ruff.txt
            black.txt
            bandit.json
            bandit.txt
            pytest.txt
