name: Publish ZCoder to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-release:
    name: Qualify Exact Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid stable release tag"
            exit 1
          fi

      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install release gate
        run: python -m pip install -e .

      - name: Await hosted checks on the exact release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/import_release_evidence.py --release-tag "$GITHUB_REF_NAME" --await --timeout-minutes 30

      - name: Enforce production qualification
        env:
          ZCODER_PITR_EVIDENCE_JSON: ${{ vars.ZCODER_PITR_EVIDENCE_JSON }}
        run: python scripts/release_gate.py --check

  build:
    name: Build and Verify Python Distributions
    needs: [qualify-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Verify package version matches release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          package_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if package_version != tag_version:
              raise SystemExit(
                  f"Release tag {tag_version!r} does not match pyproject.toml version {package_version!r}"
              )
          PY

      - name: Install pinned build tools
        run: python -m pip install build==1.5.0 twine==6.2.0

      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel

      - name: Validate distribution metadata
        run: |
          python -m twine check --strict dist/*
          python - <<'PY'
          from pathlib import Path

          distributions = list(Path("dist").iterdir())
          wheels = [path for path in distributions if path.is_file() and path.suffix == ".whl"]
          sdists = [path for path in distributions if path.is_file() and path.name.endswith(".tar.gz")]
          if len(distributions) != 2 or len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"Expected exactly one wheel and one sdist; found: {[p.name for p in distributions]}")
          PY

      - name: Upload verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zcoder-python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/zcoder/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: zcoder-python-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
