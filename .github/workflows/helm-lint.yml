name: Helm Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: helm-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  helm-lint:
    name: Helm ${{ matrix.helm-version }} Lint & Template Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        helm-version:
          - v3.21.3
          - v4.2.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm-version }}

      - name: Show Helm version
        run: helm version

      - name: Lint Helm chart
        run: helm lint deploy/helm/zcoder

      - name: Render Helm template
        run: helm template zcoder deploy/helm/zcoder
