name: Helm Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  helm-lint:
    name: Helm Chart Lint & Template Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: |
          helm lint deploy/helm/zcoder

      - name: Render Helm Template Check
        run: |
          helm template zcoder deploy/helm/zcoder
