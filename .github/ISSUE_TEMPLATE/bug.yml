name: Bug report
description: Report a reproducible defect in zcoder
title: "[Bug]: "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve zcoder. Do not report security vulnerabilities here; use SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal, deterministic steps and sanitized inputs.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: zcoder version or commit
      placeholder: "v1.x.y or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime surface
      options:
        - CLI / terminal
        - API / web backend
        - CodeAgent / tools
        - MCP / extensions
        - SDK / TypeScript
        - Docker / Helm
        - CI / release
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, provider/runtime, container details if relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or traceback
      description: Remove API keys, tokens, personal data, and production secrets.
      render: shell
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and pull requests for duplicates.
          required: true
        - label: I removed secrets and sensitive production data from this report.
          required: true
        - label: This is not a security vulnerability report.
          required: true
